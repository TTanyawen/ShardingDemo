dataSources:
  ds_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3306/db_sharding_demo?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 2640
# 如果要分库就多配一个

rules:
  - !ENCRYPT
    tables:
      tb_user: #数据库表名
        columns:
          password:
            cipherColumn: password_cipher
            encryptorName: common_encryptor
          idcard:
            cipherColumn: idcard_cipher
            encryptorName: common_encryptor
    encryptors:
      common_encryptor:
        type: AES
        props:
          aes-key-value: d6oadClrrb9A3GWo
# 分片的配置，这里就不分库了，演示一下分表，分5个表
  - !SHARDING
    tables:
      tb_user:
        # 真实数据节点，比如数据库源以及数据库在数据库中真实存在的
        actualDataNodes: ds_0.tb_user_${0..4}
#        # 分库策略 (先不做)
#        databaseStrategy:
#          # 用于单分片键的标准分片场景
#          standard:
#            # 分片键
#            shardingColumn: username
#            # 分片算法，对应 rules[0].shardingAlgorithms
#            shardingAlgorithmName: user_database_hash_mod
        # 分表策略
        tableStrategy:
          # 用于单分片键的标准分片场景
          standard:
            # 分片键
            shardingColumn: username
            # 分片算法，对应 rules[0].shardingAlgorithms
            shardingAlgorithmName: user_table_hash_mod
    # 分片算法
    shardingAlgorithms:
#      # 数据库分片算法
#      user_database_hash_mod:
#        # 根据分片键 Hash 分片
#        type: HASH_MOD
#        # 分片数量
#        props:
#          sharding-count: 1
      # 数据表分片算法
      user_table_hash_mod:
        # 根据分片键 Hash 分片
        type: HASH_MOD
        # 分片数量
        props:
          sharding-count: 5
  # 展现逻辑 SQL & 真实 SQL
props:
  sql-show: true
